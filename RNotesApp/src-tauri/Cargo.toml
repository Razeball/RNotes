[package]
name = "rnotesapp"
version = "0.6.0"
description = "A note editor"
authors = ["Razeball"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rnotesapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "tray-icon" is what makes the background mode possible; "image-png" lets the tray reuse the
# bundled window icon rather than shipping a second copy of it.
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Launching the shortcut while the app sits in the tray has to raise that window, not start a
# second copy fighting it over settings.txt.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Keeps the position of a bad node when a document from the frontend fails to deserialize.
serde_path_to_error = "0.1"
# The same version and backend as tauri-plugin-dialog, so Cargo builds one copy. rfd's default
# xdg-portal backend pulls in ashpd; 0.14 brought ashpd 0.8, which stopped compiling on stable Rust
# (the never-type fallback change, rust-lang/rust#148922) and broke the Linux release build.
rfd = { version = "0.16", default-features = false, features = ["gtk3", "common-controls-v6"] }
uuid = { version = "1", features = ["v4"] }
image = "0.25"
arboard = "3"
dirs = "5"
percent-encoding = "2"
spellbook = "0.4.2"
fontdb = "0.24.0"
ttf-parser = "0.25.1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"

